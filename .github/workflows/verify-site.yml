name: Verify portfolio site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Verify the application
        run: |
          npm install -g pnpm@11.7.0
          pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64
          pnpm dev:setup
          pnpm turbo run lint:code --filter=@formbricks/web
          pnpm turbo run build --filter=@formbricks/web
